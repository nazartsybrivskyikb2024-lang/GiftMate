{% load static %}
<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}GiftMate{% endblock %}</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'gifts/new-style.css' %}">
    {% block extra_css %}{% endblock %}
  </head>
  <body class="bg-light">
    <div class="site-wrapper">
      <div class="container py-5">
        <div class="text-center mb-4">
          <a href="{% url 'gifts:home' %}" class="text-decoration-none">
            <h1 class="display-4 fw-bold text-gradient">
              <i class="fas fa-gift me-2"></i>GiftMate
            </h1>
          </a>
          <p class="text-muted">Ласкаво просимо до GiftMate</p>
        </div>
        
        {% block content %}{% endblock %}
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
